<template>
    <lightning-card title="Related Projects" icon-name="standard:case">
      
        <div slot="actions">
            <span class="slds-badge slds-theme_success">
                Total Projects: {accountTotalProjects}
            </span>
        </div>

        <div class="slds-p-around_medium">
            <div class="slds-grid slds-gutters slds-m-bottom_small slds-alignment_absolute-center">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox
                        name="statusFilter"
                        label="Filter by Status"
                        value={statusFilter}
                        options={statusOptions}
                        onchange={handleStatusChange}>
                    </lightning-combobox>
                </div>

                <div class="slds-col slds-size_1-of-2 slds-p-top_large">
                    <lightning-input 
                        type="toggle" 
                        label="Show Only Active" 
                        checked={isToggleActive}
                        onchange={handleToggleChange}>
                    </lightning-input>
                </div>
            </div>

            <template if:true={hasProjects}>
                <lightning-datatable
                    key-field="Id"
                    data={displayedProjects}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>

                <div class="slds-m-top_small slds-grid slds-grid_align-center">
                    <lightning-button label="Previous" onclick={handlePrevious} disabled={isFirstPage}></lightning-button>
                    <span class="slds-p-horizontal_medium">Page {pageNumber} of {totalPages}</span>
                    <lightning-button label="Next" onclick={handleNext} disabled={isLastPage}></lightning-button>
                </div>
            </template>

            <template if:false={hasProjects}>
                <p class="slds-text-align_center slds-p-vertical_large">No projects found for the selected filter.</p>
            </template>
        </div>
    </lightning-card>
</template>
